name: generate snake

on:
  schedule:
    # 6시간마다 (UTC). 잔디는 자주 갱신될수록 살아있어 보인다.
    - cron: "0 */6 * * *"
  workflow_dispatch: # Actions 탭에서 수동 실행
  push:
    branches: [master]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 컨트리뷰션 그래프를 먹어치우는 뱀 SVG 생성
      # color_dots 는 왼쪽부터 활동 없음(흙) → 많음(진한 잔디) 순서다.
      - name: Generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#e6b800&color_dots=#4a3728,#aed581,#7cb342,#4a7c1f,#2d5016
            dist/snake-dark.svg?color_snake=#ffcc00&color_dots=#4a3728,#2d5016,#4a7c1f,#7cb342,#aed581

      # 생성된 SVG를 output 브랜치로 push (master 히스토리를 더럽히지 않는다)
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          # PAT 없이 기본 토큰으로 동작한다 (위 permissions: contents write 덕분).
          # 조직 리포 등에서 막히면 GH_TOKEN 시크릿을 만들어 아래 줄로 교체:
          #   GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}